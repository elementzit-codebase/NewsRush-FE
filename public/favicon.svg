<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="NewsRush">
  <!-- Solid navy tile: a filled shape holds its edges at 16px far better than a
       line drawing on transparency, and it reads on light and dark tab bars. -->
  <rect width="32" height="32" rx="7" fill="#0d1b3a"/>

  <!-- The same newspaper mark the app uses, redrawn at this size with heavier
       strokes and fewer text rules so it does not turn to mush when scaled to
       a 16px tab icon. -->
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6.5" y="8" width="14" height="16" rx="2.5"/>
    <path d="M20.5 12.5H24a1 1 0 0 1 1 1v8a2.5 2.5 0 0 1-2.5 2.5"/>
    <path d="M10 13h7"/>
    <path d="M10 17.5h4.5"/>
  </g>

  <!-- Brand-blue accent, echoing the masthead rule under the paper's name. -->
  <path d="M10 21.5h4.5" fill="none" stroke="#2f6bf6" stroke-width="2" stroke-linecap="round"/>
</svg>
